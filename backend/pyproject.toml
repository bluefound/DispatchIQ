[project]
name = "dispatchiq"
version = "0.1.0"
description = "Real-Time Delivery Intelligence & Dispatch Optimization Platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "DispatchIQ Team" }]

dependencies = [
    # ── Web Framework ──
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # ── Database ──
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
    "geoalchemy2>=0.15.0",

    # ── Redis & Celery ──
    "redis>=5.0.0",
    "celery[redis]>=5.4.0",

    # ── Auth & Security ──
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.1.0",

    # ── Validation & Serialization ──
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "orjson>=3.10.0",

    # ── Machine Learning ──
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "xgboost>=2.1.0",
    "joblib>=1.4.0",
    "numpy>=1.26.0",

    # ── Optimization ──
    "ortools>=9.10.0",

    # ── AI Agent ──
    "openai>=1.35.0",
    "google-generativeai>=0.7.0",
    "anthropic>=0.30.0",
    "tiktoken>=0.7.0",

    # ── Observability ──
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.46b0",
    "opentelemetry-instrumentation-celery>=0.46b0",
    "opentelemetry-exporter-prometheus>=0.46b0",
    "prometheus-client>=0.20.0",

    # ── Utilities ──
    "httpx>=0.27.0",
    "structlog>=24.2.0",
    "shapely>=2.0.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "locust>=2.29.0",
    "faker>=26.0.0",
    "factory-boy>=3.3.0",
]

[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
